<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#A29BFE"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Poodle Face -->
  <g transform="translate(96, 100) scale(1.4)">
    <!-- Head -->
    <circle cx="0" cy="-8" r="24" fill="#F5E6D3"/>
    <!-- Top fluff -->
    <circle cx="-8" cy="-28" r="9" fill="#F5E6D3"/>
    <circle cx="8" cy="-28" r="9" fill="#F5E6D3"/>
    <circle cx="0" cy="-32" r="10" fill="#F5E6D3"/>
    <!-- Ears -->
    <ellipse cx="-22" cy="-22" rx="6" ry="14" fill="#E8D5C4" transform="rotate(-15, -22, -22)"/>
    <ellipse cx="22" cy="-22" rx="6" ry="14" fill="#E8D5C4" transform="rotate(15, 22, -22)"/>
    <!-- Eyes -->
    <circle cx="-10" cy="-10" r="4" fill="#2D3436"/>
    <circle cx="-9" cy="-11" r="1.5" fill="white"/>
    <circle cx="10" cy="-10" r="4" fill="#2D3436"/>
    <circle cx="11" cy="-11" r="1.5" fill="white"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-2" rx="4" ry="3" fill="#2D3436"/>
    <!-- Mouth -->
    <path d="M -6 2 Q 0 8 6 2" stroke="#2D3436" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Tongue -->
    <ellipse cx="2" cy="7" rx="3" ry="5" fill="#FF6B6B"/>
    <!-- Blush -->
    <circle cx="-18" cy="-2" r="5" fill="#FFB8B8" opacity="0.4"/>
    <circle cx="18" cy="-2" r="5" fill="#FFB8B8" opacity="0.4"/>
  </g>
  <!-- Text -->
  <text x="96" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="white" opacity="0.9">HECTIC</text>
</svg>
